name: Language Job Search

on:
  workflow_dispatch:
  schedule:
    # 10:00 and 22:00 Warsaw in summer (UTC+2); 09:00 and 21:00 in winter (UTC+1)
    - cron: "0 8,20 * * *"

permissions:
  contents: write

concurrency:
  group: language-job-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore de-duplication database
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git show origin/data:local_jobs.db > local_jobs.db
            echo "Restored database ($(du -h local_jobs.db | cut -f1))."
          else
            echo "No data branch yet; starting with an empty database."
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run job search
        env:
          MAX_RUNTIME_MIN: "45"
          JOBSPY_SITES: "indeed,linkedin"
          RESULTS_WANTED: "50"
          HOURS_OLD: "168"
          CSV_RETENTION_DAYS: "7"
        run: python job_search_pl.py

      - name: Publish run summary
        if: always()
        run: |
          if [ -f reports/latest.md ]; then
            cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Persist de-duplication database
        if: always()
        run: |
          if [ ! -f local_jobs.db ]; then
            echo "No database to persist."
            exit 0
          fi
          rm -rf "$RUNNER_TEMP/job-data"
          git init -q -b data "$RUNNER_TEMP/job-data"
          cp local_jobs.db "$RUNNER_TEMP/job-data/"
          cd "$RUNNER_TEMP/job-data"
          git add local_jobs.db
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "data $(date -u +'%Y-%m-%d %H:%M')"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: Save recent jobs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jobs.csv

          if git diff --staged --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update recent jobs $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-job-search-report
          path: reports/latest.md
          if-no-files-found: ignore
